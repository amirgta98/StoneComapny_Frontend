<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Group applying the bold, pure white stroke and rounded caps to all elements -->
  <g stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Diagonal Slash connecting the layout -->
    <line x1="160" y1="160" x2="352" y2="352" />
    
    <!-- Top-Right Circle -->
    <circle cx="352" cy="160" r="32" fill="#FFFFFF" stroke="none" />
    
    <!-- Bottom-Left Circle -->
    <circle cx="160" cy="352" r="32" fill="#FFFFFF" stroke="none" />
    

    
  </g>
</svg>
